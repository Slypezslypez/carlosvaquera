<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Carlos Vaquera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-l:#e8c97a;--bg:#0d0d14;--bg2:#141420;--bg3:#1c1c2a;--bg4:#242436;--text:#e8e4d8;--muted:#7878a0;--border:rgba(255,255,255,0.07);--r:4px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:3rem;width:100%;max-width:360px;text-align:center}
.login-logo{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold);margin-bottom:.3rem}
.login-sub{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem}
.login-box input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:.8rem 1rem;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s;margin-bottom:1rem}
.login-box input:focus{border-color:var(--gold)}
.login-box button{width:100%;background:var(--gold);color:var(--bg);border:none;padding:.85rem;border-radius:var(--r);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.login-box button:hover{background:var(--gold-l)}
.login-error{color:#e05;font-size:.8rem;margin-top:.8rem}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{padding:1.6rem 1.4rem;border-bottom:1px solid var(--border)}
.sidebar-logo span{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);display:block}
.sidebar-logo small{font-size:.65rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
nav.side-nav{flex:1;padding:.8rem 0}
nav.side-nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem 1.4rem;color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;cursor:pointer;border-left:2px solid transparent;transition:color .15s,background .15s}
nav.side-nav a:hover{color:var(--text);background:rgba(255,255,255,.02)}
nav.side-nav a.active{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.05)}
nav.side-nav a svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.sidebar-foot{padding:1rem 1.4rem;border-top:1px solid var(--border)}
.sidebar-foot a{color:var(--muted);font-size:.75rem;text-decoration:none;transition:color .15s;cursor:pointer;margin-right:.8rem}
.sidebar-foot a:hover{color:var(--text)}
.main{flex:1;overflow:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:10}
.topbar h1{font-family:'Playfair Display',serif;font-size:1.2rem}
.content{padding:2rem;max-width:860px}

/* FORM */
.form-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.8rem;margin-bottom:1.5rem}
.form-section h3{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:1.4rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
.field label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:.65rem .9rem;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:90px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}

/* IMAGE UPLOAD */
.img-upload{border:1px dashed rgba(255,255,255,.12);border-radius:var(--r);padding:1.2rem;text-align:center;cursor:pointer;transition:border-color .2s;background:rgba(255,255,255,.01);position:relative}
.img-upload:hover{border-color:rgba(201,168,76,.3)}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload .img-preview{width:100%;max-height:160px;object-fit:cover;border-radius:2px;display:none;margin-bottom:.8rem;pointer-events:none}
.img-upload .img-preview.show{display:block}
.img-upload p{font-size:.72rem;color:var(--muted);pointer-events:none}
.img-upload p strong{color:var(--gold)}
.img-status{font-size:.7rem;color:var(--gold);margin-top:.4rem;min-height:1em}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.1rem;border-radius:var(--r);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;border:none;transition:all .15s;letter-spacing:.04em}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:hover{background:var(--gold-l)}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-outline:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.btn-danger{background:rgba(200,50,50,.1);color:#e05;border:1px solid rgba(200,50,50,.15)}.btn-danger:hover{background:rgba(200,50,50,.2)}
.btn svg{width:14px;height:14px}
.save-bar{display:flex;align-items:center;gap:1rem;padding-top:.5rem}
.save-msg{font-size:.78rem;color:#3c8;min-height:1.2em}
.save-msg.err{color:#e05}

/* AGENDA TABLE */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:.5rem 1rem;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.02)}
tbody td{padding:.75rem 1rem;font-size:.83rem;vertical-align:middle}
.badge{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.65rem;font-weight:500}
.badge-av{background:rgba(50,180,100,.12);color:#3c8}
.badge-so{background:rgba(200,50,50,.1);color:#c55}
.actions{display:flex;gap:.4rem}
.empty-state{text-align:center;padding:3rem;color:var(--muted);font-size:.83rem}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:480px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:.9rem;font-weight:600}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
.modal-close:hover{color:var(--text)}
.modal-body{padding:1.4rem}
.modal-foot{display:flex;justify-content:flex-end;gap:.6rem;padding:.9rem 1.4rem;border-top:1px solid var(--border)}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--r);padding:.75rem 1.1rem;font-size:.8rem;z-index:999;transform:translateY(100px);opacity:0;transition:all .3s;max-width:280px}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{border-left-color:#e05}

/* CARD GRID for spectacles/books */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.card-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem}
.card-item h4{font-size:.75rem;color:var(--gold);margin-bottom:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <div class="login-logo">Carlos Vaquera</div>
    <div class="login-sub">Administration</div>
    <input type="password" id="pw-input" placeholder="Mot de passe" autocomplete="current-password">
    <button onclick="login()">Connexion</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="layout" id="dashboard" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>Carlos Vaquera</span>
      <small>Administration</small>
    </div>
    <nav class="side-nav" id="side-nav">
      <a onclick="showTab('hero')" data-tab="hero" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>Accueil
      </a>
      <a onclick="showTab('artiste')" data-tab="artiste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>L'Artiste
      </a>
      <a onclick="showTab('spectacles')" data-tab="spectacles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>Spectacles
      </a>
      <a onclick="showTab('animations')" data-tab="animations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Animations
      </a>
      <a onclick="showTab('conferences')" data-tab="conferences">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Conférences
      </a>
      <a onclick="showTab('auteur')" data-tab="auteur">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>L'Auteur
      </a>
      <a onclick="showTab('videos')" data-tab="videos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>Vidéos
      </a>
      <a onclick="showTab('agenda')" data-tab="agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Agenda
      </a>
      <a onclick="showTab('contact')" data-tab="contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact
      </a>
    </nav>
    <div class="sidebar-foot">
      <a href="/" >← Site</a>
      <a onclick="logout()">Déconnexion</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="topbar-title">Accueil</h1>
      <div style="font-size:.72rem;color:var(--muted)">Les modifications sont sauvegardées en direct</div>
    </div>
    <div class="content" id="tab-content">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>
</div>

<!-- AGENDA MODAL -->
<div class="overlay" id="agenda-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Ajouter une date</h3>
      <button class="modal-close" onclick="closeAgendaModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date" style="width:100%;padding:.55rem .8rem;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:.9rem;color-scheme:dark" onchange="syncDateFields(this.value)">
        <input type="hidden" id="f-day">
        <input type="hidden" id="f-month">
      </div>
      <div class="field"><label>Titre</label><input type="text" id="f-title" placeholder="Grand Gala de Magie"></div>
      <div class="field"><label>Lieu</label><input type="text" id="f-venue" placeholder="Théâtre — Paris"></div>
      <div class="field"><label>Statut</label>
        <select id="f-status">
          <option value="available">Disponible</option>
          <option value="sold-out">Complet</option>
        </select>
      </div>
      <div class="field"><label>Image du spectacle</label>
        <div style="display:flex;align-items:center;gap:1rem;margin-top:.4rem">
          <img id="f-img-preview" src="" style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid rgba(201,168,76,.3);display:none">
          <label style="cursor:pointer;padding:.5rem 1rem;border:1px solid rgba(201,168,76,.4);border-radius:4px;color:var(--gold);font-size:.85rem">
            Choisir une image
            <input type="file" id="f-img" accept="image/*" style="display:none" onchange="previewAgendaImg(this)">
          </label>
          <button type="button" onclick="clearAgendaImg()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem">Supprimer</button>
        </div>
        <input type="hidden" id="f-img-b64">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeAgendaModal()">Annuler</button>
      <button class="btn btn-gold" onclick="saveAgenda()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('cv_token');
let CONTENT = {};

if (TOKEN) initDashboard();

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const pw = document.getElementById('pw-input').value;
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
  const j = await r.json();
  if (j.error) { document.getElementById('login-error').textContent = j.error; return; }
  TOKEN = j.token;
  localStorage.setItem('cv_token', TOKEN);
  initDashboard();
}

function logout() {
  localStorage.removeItem('cv_token');
  TOKEN = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function initDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
  // Load existing content
  try {
    const r = await fetch('/api/content');
    CONTENT = await r.json();
  } catch(e) { CONTENT = {}; }
  showTab('hero');
}

// ── TABS ─────────────────────────────────────────────────────────
const TAB_TITLES = { hero:'Accueil', artiste:"L'Artiste", spectacles:'Spectacles', animations:'Animations', conferences:'Conférences', auteur:"L'Auteur", videos:'Vidéos', agenda:'Agenda', contact:'Contact' };

function showTab(tab) {
  document.querySelectorAll('.side-nav a').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  document.getElementById('topbar-title').textContent = TAB_TITLES[tab];
  const fn = { hero: renderHero, artiste: renderArtiste, spectacles: renderSpectacles, animations: renderAnimations, conferences: renderConferences, auteur: renderAuteur, videos: renderVideos, agenda: renderAgenda, contact: renderContact };
  fn[tab]?.();
}

// ── HELPERS ──────────────────────────────────────────────────────
function c(key, fallback = '') { return CONTENT[key] || fallback; }

function fieldHtml(label, key, fallback = '', type = 'input') {
  const val = c(key, fallback).replace(/"/g, '&quot;');
  if (type === 'textarea') return `<div class="field"><label>${label}</label><textarea data-key="${key}">${c(key, fallback)}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input type="text" data-key="${key}" value="${val}"></div>`;
}

function imgHtml(label, key) {
  return `<div class="field"><label>${label}</label>
    <div class="img-upload" id="upload-${key}">
      <input type="file" accept="image/*" onchange="uploadImg(event,'${key}')">
      <img class="img-preview" id="prev-${key}" src="/api/upload?key=${key}&t=${Date.now()}" onerror="this.style.display='none'" onload="this.style.display='block'">
      <p>📷 <strong>Cliquez ou glissez</strong> une image<br><span style="font-size:.65rem;opacity:.5">JPG, PNG — max 2 Mo</span></p>
    </div>
    <div style="margin-top:.4rem">
      <button type="button" class="btn btn-danger" style="font-size:.7rem;padding:.3rem .8rem" onclick="deleteImg('${key}')">🗑 Supprimer l'image</button>
    </div>
    <div class="img-status" id="status-${key}"></div>
  </div>`;
}

function saveBar(section) {
  return `<div class="save-bar">
    <button class="btn btn-gold" onclick="saveSection('${section}')">💾 Enregistrer ${TAB_TITLES[section]}</button>
    <div class="save-msg" id="msg-${section}"></div>
  </div>`;
}

async function saveSection(section) {
  const container = document.getElementById('tab-content');
  const inputs = container.querySelectorAll('[data-key]');
  const updates = Array.from(inputs).map(el => ({ key: el.dataset.key, value: el.value }));
  const msg = document.getElementById('msg-' + section);
  msg.textContent = 'Sauvegarde…';
  try {
    const r = await fetch('/api/content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
      body: JSON.stringify({ updates })
    });
    if (r.status === 401) { logout(); return; }
    CONTENT = await r.json();
    msg.textContent = '✓ Sauvegardé';
    msg.className = 'save-msg';
    toast('Section sauvegardée ✓');
    setTimeout(() => msg.textContent = '', 3000);
  } catch {
    msg.textContent = 'Erreur';
    msg.className = 'save-msg err';
  }
}

async function deleteImg(key) {
  if (!confirm('Supprimer cette image ?')) return;
  const r = await fetch(`/api/upload?key=${key}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${TOKEN}` }
  });
  if (r.status === 401) { logout(); return; }
  const prev = document.getElementById('prev-' + key);
  if (prev) { prev.src = ''; prev.style.display = 'none'; }
  toast('Image supprimée ✓');
}

function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ dataUrl, mime_type: 'image/jpeg' });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadImg(event, key) {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById('status-' + key);
  status.textContent = 'Compression…';
  // Compress to max 1600x1600, quality 0.82 — target < 1.5 Mo
  const { dataUrl, mime_type } = await compressImage(file, 1600, 1600, 0.82);
  const base64 = dataUrl.split(',')[1];
  const kb = Math.round(base64.length * 0.75 / 1024);
  status.textContent = `Upload en cours… (${kb} Ko)`;
  try {
    const r = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
      body: JSON.stringify({ key, data: base64, mime_type })
    });
    if (r.status === 401) { logout(); return; }
    status.textContent = '✓ Image mise à jour';
    const prev = document.getElementById('prev-' + key);
    if (prev) { prev.src = `/api/upload?key=${key}&t=${Date.now()}`; prev.style.display = 'block'; }
    toast('Image mise à jour ✓');
    setTimeout(() => status.textContent = '', 3000);
  } catch { status.textContent = 'Erreur upload'; }
}

function toast(msg, err = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── RENDER TABS ───────────────────────────────────────────────────

function renderHero() {
  document.getElementById('tab-content').innerHTML = `
    <div class="form-section">
      <h3>Texte principal</h3>
      ${fieldHtml('Titre principal', 'hero_title', 'Carlos<br><em>Vaquera</em>')}
      ${fieldHtml('Phrase signature', 'hero_tagline', '« Your illusions are my reality »')}
      ${fieldHtml('Sous-titre', 'hero_subtitle', 'Magicien · Mentaliste · Conférencier')}
      ${fieldHtml('Texte bouton 1', 'hero_btn1', 'Découvrir les spectacles')}

async function renderAgenda() {
  document.getElementById('tab-content').innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
      <button class="btn btn-gold" onclick="openAgendaModal()">+ Ajouter une date</button>
    </div>
    <div class="form-section" style="padding:0;overflow:hidden">
      <div id="agenda-table"><div class="empty-state">Chargement…</div></div>
    </div>`;
  const r = await fetch('/api/agenda');
  agendaRows = await r.json();
  renderAgendaTable();
}

function renderAgendaTable() {
  const el = document.getElementById('agenda-table');
  if (!agendaRows.length) { el.innerHTML = '<div class="empty-state">Aucune date.</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Image</th><th>Date</th><th>Spectacle</th><th>Lieu</th><th>Statut</th><th></th></tr></thead>
    <tbody>${agendaRows.map(s => `
      <tr>
        <td>${s.image ? `<img src="${s.image}" style="width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid rgba(201,168,76,.3)">` : '<span style="color:var(--muted);font-size:.75rem">—</span>'}</td>
        <td style="color:var(--gold);font-weight:600">${s.day} ${s.month}</td>
        <td>${s.title}</td>
        <td style="color:var(--muted)">${s.venue}</td>
        <td><span class="badge badge-${s.status==='sold-out'?'so':'av'}">${s.status==='sold-out'?'Complet':'Disponible'}</span></td>
        <td><div class="actions">
          <button class="btn btn-outline" onclick='editAgenda(${JSON.stringify(s)})'>Modifier</button>
          <button class="btn btn-danger" onclick="deleteAgenda(${s.id})">Suppr.</button>
        </div></td>
      </tr>`).join('')}
    </tbody></table>`;
}

const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];

function syncDateFields(val) {
  if (!val) return;
  const [y, m, d] = val.split('-');
  document.getElementById('f-day').value = String(parseInt(d));
  document.getElementById('f-month').value = MONTHS_FR[parseInt(m)-1] + ' ' + y;
}

function dateFromDayMonth(day, month) {
  // month = "Sep 2026" → try to parse back to YYYY-MM-DD
  if (!day || !month) return '';
  const parts = month.split(' ');
  if (parts.length < 2) return '';
  const year = parts[1];
  const mIdx = MONTHS_FR.indexOf(parts[0]);
  if (mIdx < 0) return '';
  return `${year}-${String(mIdx+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function openAgendaModal(item = null) {
  document.getElementById('modal-title').textContent = item ? 'Modifier la date' : 'Ajouter une date';
  document.getElementById('edit-id').value  = item?.id    ?? '';
  document.getElementById('f-day').value    = item?.day   ?? '';
  document.getElementById('f-month').value  = item?.month ?? '';
  document.getElementById('f-date').value   = item ? dateFromDayMonth(item.day, item.month) : '';
  document.getElementById('f-title').value  = item?.title ?? '';
  document.getElementById('f-venue').value  = item?.venue ?? '';
  document.getElementById('f-status').value = item?.status ?? 'available';
  document.getElementById('f-img-b64').value = item?.image ?? '';
  const prev = document.getElementById('f-img-preview');
  if (item?.image) { prev.src = item.image; prev.style.display = 'block'; }
  else { prev.src = ''; prev.style.display = 'none'; }
  document.getElementById('f-img').value = '';
  document.getElementById('agenda-modal').classList.add('open');
}

function previewAgendaImg(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById('f-img-b64').value = e.target.result;
    const prev = document.getElementById('f-img-preview');
    prev.src = e.target.result;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearAgendaImg() {
  document.getElementById('f-img-b64').value = '';
  document.getElementById('f-img').value = '';
  const prev = document.getElementById('f-img-preview');
  prev.src = ''; prev.style.display = 'none';
}

function editAgenda(item) { openAgendaModal(item); }
function closeAgendaModal() { document.getElementById('agenda-modal').classList.remove('open'); }
document.getElementById('agenda-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAgendaModal(); });

async function saveAgenda() {
  const body = {
    id:     document.getElementById('edit-id').value || undefined,
    day:    document.getElementById('f-day').value.trim(),
    month:  document.getElementById('f-month').value.trim(),
    title:  document.getElementById('f-title').value.trim(),
    venue:  document.getElementById('f-venue').value.trim(),
    status: document.getElementById('f-status').value,
    image:  document.getElementById('f-img-b64').value || null,
  };
  if (!body.title) { toast('Le titre est requis.', true); return; }
  const r = await fetch('/api/agenda', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
    body: JSON.stringify(body)
  });
  if (r.status === 401) { logout(); return; }
  agendaRows = await r.json();
  renderAgendaTable();
  closeAgendaModal();
  toast('Enregistré ✓');
}

async function deleteAgenda(id) {
  if (!confirm('Supprimer cette date ?')) return;
  const r = await fetch(`/api/agenda?id=${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${TOKEN}` } });
  if (r.status === 401) { logout(); return; }
  agendaRows = agendaRows.filter(s => s.id !== id);
  renderAgendaTable();
  toast('Supprimé ✓');
}
</script>
